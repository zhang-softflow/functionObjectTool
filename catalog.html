<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFOAM Function Objects</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6a737d;
  --border: #e1e4e8; --accent: #0b6e99; --accent-bg: #e6f3f8;
  --req: #c0392b; --code-bg: #f3f4f6; --chip: #eef1f4; --sel: #dbeef6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --text: #e6e6e6; --muted: #9aa4ae;
    --border: #2d3238; --accent: #5cc3ec; --accent-bg: #173340;
    --req: #ff7b6b; --code-bg: #121416; --chip: #262a2f; --sel: #1f3a47;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --text: #e6e6e6; --muted: #9aa4ae;
  --border: #2d3238; --accent: #5cc3ec; --accent-bg: #173340;
  --req: #ff7b6b; --code-bg: #121416; --chip: #262a2f; --sel: #1f3a47;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
code, pre { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .meta { color: var(--muted); font-size: 12px; }
header button { margin-left: auto; }
button { background: var(--chip); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; font-size: 12px; }
button:hover { border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100% - 49px); }
aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.controls { padding: 10px; border-bottom: 1px solid var(--border); }
#q { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font: inherit; }
#q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; }
.chip.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.opts { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
#list { overflow-y: auto; flex: 1; margin: 0; padding: 0; list-style: none; }
#list li { padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
#list li:hover { background: var(--accent-bg); }
#list li.sel { background: var(--sel); }
#list .n { font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
#list .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--chip);
  color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.count { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
main { overflow-y: auto; padding: 20px 28px 60px; min-width: 0; }
main h2 { margin: 0 0 4px; font-size: 22px; font-family: ui-monospace, Menlo, Consolas, monospace; }
main h3 { font-size: 14px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sub { color: var(--muted); font-size: 12.5px; }
.desc { white-space: pre-wrap; }
.codebox { position: relative; }
.codebox pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; overflow-x: auto; margin: 0; }
.codebox button { position: absolute; top: 6px; right: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.k { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
tr.req td.k { color: var(--req); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.theading { font-weight: 600; margin: 12px 0 4px; }
ul.paths { margin: 0; padding-left: 18px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
details summary { cursor: pointer; color: var(--accent); }
.empty { color: var(--muted); margin-top: 40px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 45vh; }
  main { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>OpenFOAM Function Objects</h1>
  <span class="meta" id="meta"></span>
  <button id="theme" title="Toggle theme">Theme</button>
</header>
<div class="layout">
  <aside>
    <div class="controls">
      <input id="q" type="search" placeholder="Search name, description, parameter... (/)" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="opts">
        <label><input type="checkbox" id="optF"> #includeFunc only</label>
        <label><input type="checkbox" id="optC"> incl. cloud functions</label>
      </div>
    </div>
    <ul id="list"></ul>
    <div class="count" id="count"></div>
  </aside>
  <main id="detail"><p class="empty">Select a function object.</p></main>
</div>
<script>
const DB = {"version": "OpenFOAM-v2606", "built": "2026-11-25", "functionObjects": {"abort": {"name": "abort", "kind": "functionObject", "registered": true, "group": "grpUtilitiesFunctionObjects", "header": "src/functionObjects/utilities/abort/abort.H", "libs": ["utilityFunctionObjects"], "summary": "Watches for presence of the named trigger file in the case directory and signals a simulation stop (or other) event if found.", "description": "Watches for presence of the named trigger file in the case directory\nand signals a simulation stop (or other) event if found.\n\nThe presence of the trigger file is only checked on the master process.\n\nCurrently the following action types are supported:\n- noWriteNow\n- writeNow\n- nextWrite", "example": "abortFO\n{\n    // Mandatory entries\n    type            abort;\n    libs            (utilityFunctionObjects);\n\n    // Optional entries\n    file            <word>;  // \"<case>/GOODBYE\";\n    action          <word>;\n\n    // Inherited entries\n    ...\n}", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: abort", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: utilityFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "file", "desc": "The trigger filename", "type": "word", "reqd": "no", "default": "\\<case\\>/name"}, {"name": "action", "desc": "The default action to trigger", "type": "word", "reqd": "no", "default": "nextWrite"}]}], "inherited": ["timeFunctionObject.H"], "note": "The trigger file is considered \"sticky\". This means that once detected\nand processed, the trigger is duly noted and the file will not be\nrechecked. It is not possible or desirable to 'untrigger' an action.", "seeAlso": "", "includeFunc": [], "tutorials": ["tutorials/compressible/rhoSimpleFoam/gasMixing/injectorPipe/system/abort", "tutorials/compressible/rhoSimpleFoam/squareBendLiq/system/abort", "tutorials/compressible/rhoSimpleFoam/squareBendLiqNoNewtonian/system/abort"], "aliases": ""}, "add": {"name": "add", "kind": "functionObject", "registered": true, "group": "grpFieldFunctionObjects", "header": "src/functionObjects/field/add/add.H", "libs": ["fieldFunctionObjects"], "summary": "Sums a given list of (at least two or more) fields and outputs the result into a new field. All input fields must have matching sizes and compatible dimensions; otherwise, an error will be raised.", "description": "Sums a given list of (at least two or more) fields and outputs the result\ninto a new field. All input fields must have matching sizes and compatible\ndimensions; otherwise, an error will be raised.\n\nOperands:\n\nwhere Type can be one of:\n    Scalar, Vector, SphericalTensor, SymmTensor, or Tensor.", "example": "addFO\n{\n    // Mandatory entries\n    type            add;\n    libs            (fieldFunctionObjects);\n\n    // Inherited entries\n    fields          (<wordList>);  // (<field1> <field2> ... <fieldN>);\n    ...\n}", "otherExamples": ["fieldResult = field1 + field2 + ... + fieldN"], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: add", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: fieldFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "fields", "desc": "Names of operand fields (at least two)", "type": "wordList", "reqd": "yes", "default": ""}]}], "inherited": ["fieldsExpression.H"], "note": "", "seeAlso": "", "includeFunc": ["fields/add"], "tutorials": ["tutorials/incompressible/pisoFoam/RAS/cavity/system/FOs/FOadd", "tutorials/multiphase/twoPhaseEulerFoam/laminar/bubbleColumn/system/controlDict"], "aliases": ""}, "age": {"name": "age", "kind": "functionObject", "registered": true, "group": "grpFieldFunctionObjects", "header": "src/functionObjects/field/age/age.H", "libs": ["fieldFunctionObjects"], "summary": "Calculates and writes out the time taken for a particle to travel from an inlet to the location. Solves the following equation when incompressible:", "description": "Calculates and writes out the time taken for a particle to travel from an\ninlet to the location. Solves the following equation when incompressible:\n\n[formula]\n\nwhere\n\\vartable\n    t    | Age [s]\n    \\phi | Volumetric flux [m^3/s]\n\\endvartable\n\nBoundary conditions are generated automatically as zeroGradient\non all walls and inletOutlet everywhere else.", "example": "ageFO\n{\n    // Mandatory entries\n    type            age;\n    libs            (fieldFunctionObjects);\n\n    // Optional entries\n    phi             <word>;\n    rho             <word>;\n    schemesField    <word>;\n    tolerance       <scalar>;\n    nCorr           <int>;\n    diffusion       <bool>;\n\n    // Inherited entries\n    ...\n}", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: age", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: fieldFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "phi", "desc": "Name of flux field", "type": "word", "reqd": "no", "default": "phi"}, {"name": "rho", "desc": "Name of density field", "type": "word", "reqd": "no", "default": "rho"}, {"name": "schemesField", "desc": "Name of the field from which schemes are taken", "type": "word", "reqd": "no", "default": "age"}, {"name": "tolerance", "desc": "Solver residual control", "type": "scalar", "reqd": "no", "default": "1e-5"}, {"name": "nCorr", "desc": "Maximum number of correctors", "type": "int", "reqd": "no", "default": "5"}, {"name": "diffusion", "desc": "Flag to turn on/off the diffusion term", "type": "bool", "reqd": "no", "default": "false"}]}], "inherited": ["functionObject.H"], "note": "", "seeAlso": "- Foam::functionObjects::comfort", "includeFunc": [], "tutorials": ["tutorials/heatTransfer/buoyantSimpleFoam/comfortHotRoom/system/FOage"], "aliases": ""}, "agglomerationInfo": {"name": "agglomerationInfo", "kind": "functionObject", "registered": true, "group": "grpUtilitiesFunctionObjects", "header": "src/functionObjects/utilities/agglomerationInfo/agglomerationInfo.H", "libs": ["utilityFunctionObjects"], "summary": "Writes the agglomeration information for a GAMG solver to a file, controlled by the writeControl entry in the function-object dictionary.", "description": "Writes the agglomeration information for a GAMG solver to a file,\ncontrolled by the writeControl entry in the function-object dictionary.\n\nEach agglomeration level is written as a volScalarField with the cell values\nbeing the index of the coarser cell in the next level.\n\nOverall agglomeration statistics are written to a file in the\npostProcessing directory.", "example": "agglomerationInfoFO\n{\n    // Mandatory entries\n    type            agglomerationInfo;\n    libs            (utilityFunctionObjects);\n    field           <fieldName>;\n\n    // Optional entries\n    writeControl   runTime;\n}", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: agglomerationInfo", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: utilityFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "field", "desc": "Name of the field to be agglomerated", "type": "word", "reqd": "yes", "default": ""}]}], "inherited": [], "note": "", "seeAlso": "", "includeFunc": [], "tutorials": [], "aliases": ""}, "AMIWeights": {"name": "AMIWeights", "kind": "functionObject", "registered": true, "group": "grpFieldFunctionObjects", "header": "src/functionObjects/field/AMIWeights/AMIWeights.H", "libs": ["fieldFunctionObjects"], "summary": "Computes the min/max/average weights of arbitrary mesh interface (AMI) patches, and optionally reports to a text file or writes VTK surfaces of the sum of the weights and mask fields for arbitrarily coupled mesh interface (ACMI) patches.", "description": "Computes the min/max/average weights of arbitrary mesh interface (AMI)\npatches, and optionally reports to a text file or writes VTK surfaces of\nthe sum of the weights and mask fields for arbitrarily coupled mesh\ninterface (ACMI) patches.\n\nOperands:", "example": "AMIWeightsFO\n{\n    // Mandatory entries\n    type            AMIWeights;\n    libs            (fieldFunctionObjects);\n    writeFields     <bool>;\n\n    // Inherited entries\n    ...\n}", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: AMIWeights", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: fieldFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "writeFields", "desc": "Write weights as VTK fields", "type": "bool", "reqd": "yes", "default": ""}]}], "inherited": ["functionObject.H", "writeFile.H"], "note": "", "seeAlso": "", "includeFunc": ["fields/AMIWeights"], "tutorials": ["tutorials/incompressible/pimpleFoam/RAS/propeller/system/AMIWeights"], "aliases": ""}, "areaWrite": {"name": "areaWrite", "kind": "functionObject", "registered": true, "group": "grpUtilitiesFunctionObjects", "header": "src/functionObjects/utilities/areaWrite/areaWrite.H", "libs": ["utilityFunctionObjects"], "summary": "Write finite area mesh/fields to standard output formats.", "description": "Write finite area mesh/fields to standard output formats.", "example": "areaWriteFO\n{\n    // Mandatory entries\n    type            areaWrite;\n    libs            (utilityFunctionObjects);\n    fields          (<wordRes>);  // (p U);\n    surfaceFormat   <word>;       // vtk;\n\n    // Output surface format\n    formatOptions\n    {\n        vtk\n        {\n            precision  10;\n        }\n    }\n\n    // Optional entries\n    verbose         <word>;\n\n    // Conditional entries\n\n        // Option-1\n        areas           (<wordRes>);\n\n        // Option-2\n        area            <word>;\n\n    // Inherited entries\n    ...\n}", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: areaWrite", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: utilityFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "fields", "desc": "Name of operand fields", "type": "wordRes", "reqd": "yes", "default": ""}, {"name": "surfaceFormat", "desc": "Output surface format", "type": "word", "reqd": "yes", "default": ""}, {"name": "areas", "desc": "Names of finite-area regions", "type": "wordRes", "reqd": "no", "default": ""}, {"name": "area", "desc": "Name of finite-area region", "type": "word", "reqd": "no", "default": ""}, {"name": "formatOptions", "desc": "Dictionary of format options", "type": "dict", "reqd": "no", "default": ""}]}], "inherited": ["functionObject.H", "surfaceWriter.H"], "note": "", "seeAlso": "", "includeFunc": [], "tutorials": ["tutorials/finiteArea/surfactantFoam/planeTransport/system/areaWrite", "tutorials/incompressible/pimpleFoam/laminar/filmPanel0/system/sampling", "tutorials/lagrangian/kinematicParcelFoam/drippingChair/system/areaWrite"], "aliases": ""}, "BilgerMixtureFraction": {"name": "BilgerMixtureFraction", "kind": "functionObject", "registered": true, "group": "grpThermophysicalFunctionObjects", "header": "src/thermophysicalModels/chemistryModel/functionObjects/BilgerMixtureFraction/BilgerMixtureFraction.H", "libs": ["fieldFunctionObjects"], "summary": "Calculates the Bilger mixture-fraction field (i.e. f_{\\mathrm{Bilger}}) based on the elemental composition of the mixture. Elements C, H, S and O are considered.", "description": "Calculates the Bilger mixture-fraction field (i.e.\nf_{\\mathrm{Bilger}}) based on the elemental composition\nof the mixture. Elements C, H, S and O are considered.\n\nf_{\\mathrm{Bilger}} is the mass mixing ratio of fuel and oxidiser\nin [kg fuel / kg mixture], and is invariant to the reaction progress of\nthe mixture (e.g. the same for unburnt and burnt mixtures).\n\nf_{\\mathrm{Bilger}} equals to the unity\nfor pure fuel and to zero for pure oxidiser.\n\nThe Bilger mixture-fraction field is computed based on the following:\n\n[formula]\n\nwith\n\n[formula]\n\nwhere\n\\vartable\n  \\beta               | Coupling function                        [kmol/kg]\n  Y_e                 | Elemental mass fraction of element, e\n  W_e                 | Atomic weight of element, e\n  {.}_{\\mathrm{ox}}   | Subscript to denote oxidiser composition\n  {.}_{\\mathrm{fuel}} | Subscript to denote fuel composition\n\\endvartable\n\nOperands:\n\nReferences:", "example": "BilgerMixtureFraction1\n{\n    // Mandatory entries (unmodifiable)\n    type                 BilgerMixtureFraction;\n    libs                 (fieldFunctionObjects);\n\n    // Mandatory entries (runtime modifiable)\n    fuel\n    {\n        // Optional entries (runtime modifiable)\n        fractionBasis    mass;\n\n        // Conditional mandatory entries (runtime modifiable)\n        CH4              1;\n    }\n\n    oxidiser\n    {\n        // Optional entries (runtime modifiable)\n        fractionBasis    mole;\n\n        // Conditional mandatory entries (runtime modifiable)\n        O2               0.23;\n        N2               0.77;\n    }\n\n    // Optional entries (runtime modifiable)\n    phase                <phaseName>;\n    result               <resultName>;\n\n    // Optional (inherited) entries\n    ...\n}", "otherExamples": ["mass   | Interpret species fractions as mass fractions\nmole   | Interpret species fractions as mole fractions", "Original method:\n    Bilger, R. W. (1979).\n    Turbulent jet diffusion flames.\n    Energy and Combustion Science, p. 109-131.\n    DOI:10.1016/B978-0-08-024780-9.50011-3\n\nImplementation:\n    Zirwes, T., Zhang, F., Habisreuther, P., Hansinger, M.,\n    Bockhorn, H., Pfitzner, M., & Trimis, D. (2019).\n    Quasi-DNS dataset of a piloted flame\n    with inhomogeneous inlet conditions.\n    Flow, Turbulence and Combustion, vol 104, p. 997-1027.\n    DOI:10.1007/s10494-019-00081-5"], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: BilgerMixtureFraction", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: fieldFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "fuel", "desc": "Dictionary for fuel composition", "type": "dict", "reqd": "yes", "default": ""}, {"name": "oxidiser", "desc": "Dictionary for oxidiser composition", "type": "dict", "reqd": "yes", "default": ""}, {"name": "phase", "desc": "Name of phase (e.g. \"gas\")", "type": "word", "reqd": "no", "default": ""}, {"name": "result", "desc": "Name of resulting field", "type": "word", "reqd": "no", "default": ""}, {"name": "fractionBasis", "desc": "Species-fraction interpretation method", "type": "word", "reqd": "no", "default": ""}]}], "inherited": ["functionObject.H"], "note": "- The mole or mass fractions are automatically normalized to the unity.", "seeAlso": "- Foam::functionObject\n- Foam::functionObjects::fvMeshFunctionObject", "includeFunc": [], "tutorials": ["tutorials/combustion/reactingFoam/laminar/counterFlowFlame2D/system/FOBilgerMixtureFraction"], "aliases": ""}, "binField": {"name": "binField", "kind": "functionObject", "registered": true, "group": "grpFieldFunctionObjects", "header": "src/functionObjects/field/binField/binField.H", "libs": ["fieldFunctionObjects"], "summary": "Calculates binned data, where specified patches are divided into segments according to various input bin characteristics, so that spatially-localised information can be output for each segment.", "description": "Calculates binned data, where specified patches are divided into\nsegments according to various input bin characteristics, so that\nspatially-localised information can be output for each segment.\n\nOperands:\n\nwhere Type can be one of:\n    Scalar, Vector, SphericalTensor, SymmTensor, or Tensor.", "example": "binFieldFO\n{\n    // Mandatory entries\n    type                    binField Fields": {"name": "derivedFields", "kind": "functionObject", "registered": true, "group": "grpFieldFunctionObjects", "header": "src/functionObjects/field/derivedFields/derivedFields.H", "libs": ["fieldFunctionObjects"], "summary": "Computes two predefined derived fields, i.e. rhoU, and pTotal, where the defined fields are hard-coded as follows:", "description": "Computes two predefined derived fields, i.e. rhoU, and pTotal, where\nthe defined fields are hard-coded as follows:\n\n\\vartable\n  rhoU              |  \\rho \\vec U \n  pTotal            |  p + 1/2 \\rho \\, mag(\\vec U)^2 \n\\endvartable\n\nOperands:", "example": "derivedFieldsFO\n{\n    // Mandatory entries\n    type            derivedFields;\n    libs            (fieldFunctionObjects);\n    derived         (rhoU pTotal);\n\n    // Optional entries\n    rhoRef          <scalar>;\n\n    // Inherited entries\n    ...\n}", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: derivedFields", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: fieldFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "derived", "desc": "Names of operand fields (rhoU/pTotal)", "type": "word", "reqd": "yes", "default": ""}, {"name": "rhoRef", "desc": "Reference density for incompressible flows", "type": "scalar", "reqd": "no", "default": "1.0"}]}], "inherited": ["functionObject.H"], "note": "", "seeAlso": "", "includeFunc": [], "tutorials": ["tutorials/compressible/rhoSimpleFoam/gasMixing/injectorPipe/system/derivedFields", "tutorials/compressible/rhoSimpleFoam/squareBend/system/derivedFields", "tutorials/incompressible/simpleFoam/squareBend/system/derivedFields"], "aliases": ""}, "DESModelRegions": {"name": "DESModelRegions", "kind": "functionObject", "registered": true, "group": "grpFieldFunctionObjects", "header": "src/functionObjects/field/DESModelRegions/DESModelRegions.H", "libs": ["fieldFunctionObjects"], "summary": "Compute strictly assuming a quasi-static electrostatic field for single-phase and multiphase applications.", "description": "Computes the steady-state equation of charge conservation to obtain\nthe electric potential by strictly assuming a quasi-static electrostatic\nfield for single-phase and multiphase applications.\n\nThe steady-state equation of the charge conservation:\n\n[formula]\n\nwhere\n\\vartable\n  V       | Electric potential                [volt = kg m^2/(A s^3)]\n  \\sigma  | Isotropic conductivity of mixture [S/m = A^2 s^3/(kg m^3)]\n\\endvartable\n\nOptionally, electric field, current density and free-charge\ndensity fields can be written out by using the following equations:\n\n[formula]\n\n[formula]\n\n[formula]\n\nwhere\n\\vartable\n  \\vec{E}    | Electric field                       [m kg/(s^3 A)]\n  \\vec{J}    | Current density                      [A/m^2]\n  \\rho_E     | Volume charge density                [C/m^3 = A s/m^3]\n  \\epsilon_m | Isotropic permittivity of mixture    [F/m = A^2 s^4/(kg m^3)]\n  \\epsilon_0 | Isotropic vacuum permittivity        [F/m = A^2 s^4/(kg m^3)]\n  \\epsilon_r | Isotropic relative permittivity of mixture [-]\n\\endvartable\n\nFor multiphase applications, sigma and epsilonr are blended\n(to consider their interface values) by using the simple weighted\narithmetic mean interpolation, for example:\n\n[formula]", "example": "electricPotentialFO\n{\n    // Mandatory entries\n    type            electricPotential;\n    libs            (solverFunctionObjects);\n\n    // Conditional entries\n\n        // Option-1: single-phase\n        sigma       <scalar>;\n        epsilonr    <scalar>;\n\n        // Option-2: multiphase\n        phases\n        {\n            alpha.air\n            {\n                sigma       <scalar>;\n                epsilonr    <scalar>;\n            }\n            alpha.water\n            {\n                sigma       <scalar>;\n                epsilonr    <scalar>;\n            }\n            a ta is transferred to- and from\nOpenFOAM. The data exchange employs specialised boundary conditions to\nprovide either one-way or two-way coupling models.\n\nThe coupling is through plain text files where OpenFOAM boundary data\nis read/written as one line per face (data from all processors collated):\n\nwhere the actual entries depend on the boundary condition type:\n- mixed: value, snGrad, refValue, refGrad, valueFraction\n- externalCoupledMixed: output of writeDataMaster\n- other: value, snGrad\n\nThese text files are located in a user specified communications directory\nwhich gets read/written on the master processor only.\n\nIn the communications directory the structure will be:\n\n(where regionsName is either the name of a single region or a composite\nof multiple region names)\n\nAt start-up, the boundary creates a lock file, i.e.:\n\n... to signal the external source to wait. During the function object\nexecution the boundary values are written to files (one per region,\nper patch(group), per field), e.g.\n\nThe lock file is then removed, instructing the external source to take\ncontrol of the program execution. When ready, the external program\nshould create the return values, e.g. to files\n\n... and then reinstate the lock file. The function object will then\nread these values, apply them to the boundary conditions and pass\nprogram execution back to OpenFOAM.", "example": "externalCoupledFO\n{\n    // Mandatory entries\n    type            externalCoupled;\n    libs            (fieldFunctionObjects);\n    commsDir        \"<case>/comms\";\n    regions\n    {\n        \"(region1|region0)\"         // Name of region(s)\n        {\n            TPatchGroup             // Name of patch(group)\n            {\n                readFields  (p);    // List of fields to read\n                writeFields (T);    // List of fields to write\n            }\n        }\n    }\n    initByExternal  true;\n\n    // Optional entries\n    waitInterval    1;\n    timeOut         100;\n    statusDone      done;  // Any arbitrary status=... value\n    calcFrequency   1;\n\n    // Inherited entries\n    ...\n}", "otherExamples": ["comms/region0_region1/TPatchGroup/", "patchPoints     (collected points)\npatchFaces      (collected faces)\np.in            (input file of p, written by external application)\nT.out           (output file of T, written by OpenFOAM)", "# Patch: <patch name>\n<fld1> <fld2> .. <fldn>             //face0\n<fld1> <fld2> .. <fldn>             //face1\n..\n<fld1> <fld2> .. <fldn>             //faceN", "<regionsName>/<patchGroup>/<fieldName>.[in|out]"], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: externalCoupled", "type": "word", "reqd": "yes", "default": ""}, {"name": "libs", "desc": "Library name: fieldFunctionObjects", "type": "word", "reqd": "yes", "default": ""}, {"name": "commsDir", "desc": "Communication directory", "type": "word", "reqd": "yes", "default": ""}, {"name": "regions", "desc": "The regions to couple", "type": "word", "reqd": "yes", "default": ""}, {"name": "initByExternal", "desc": "Initialization values supplied by external app", "type": "bool", "reqd": "yes", "default": ""}, {"name": "waitInterval", "desc": "Wait interval in [s]", "type": "label", "reqd": "no", "default": "1"}, {"name": "timeOut", "desc": "Timeout in [s]", "type": "label", "reqd": "no", "default": "100*waitInterval"}, {"name": "statusDone", "desc": "Lockfile status=... on termination", "type": "word", "reqd": "no", "default": "done"}, {"name": "calcFrequency", "desc": "Calculation frequency", "type": "label", "reqd": "no", "default": "1"}]}], "inherited": ["timeFunctionObject.H"], "note": "", "seeAlso": "", "includeFunc": [], "tutorials": ["tutorials/compressible/rhoPimpleFoam/RAS/externalCoupledSquareBendLiq/system/externalCoupled", "tutorials/heatTransfer/chtMultiRegionFoam/externalCoupledHeater/system/externalCoupled", "tutorials/heatTransfer/chtMultiRegionSimpleFoam/externalCoupledHeater/system/exter ": ""}, "sampledSet": {"name": "sampledSet", "kind": "base", "registered": false, "group": "grpUtilitiesFunctionObjects", "header": "src/sampling/sampledSet/sampledSet/sampledSet.H", "libs": [], "summary": "Holds list of sampling points which is filled at construction time. Various implementations of this base class to e.g. get sampling points at uniform distance along a line (uniformSet) or directly specified (cloudSet)", "description": "Holds list of sampling points which is filled at construction time.\nVarious implementations of this base class to e.g. get sampling points\nat uniform distance along a line (uniformSet) or directly specified\n(cloudSet)\n\nEach 'sampledSet' has a name and a specifier of how the axis should be\nwrite (x/y/z component or all 3 components)\n\nFor a dictionary specification:", "example": "", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "axis", "desc": "x, y, z, xyz, distance", "type": "", "reqd": "yes", "default": ""}]}], "inherited": [], "note": "", "seeAlso": "", "includeFunc": [], "tutorials": [], "aliases": ""}, "sampledSurface": {"name": "sampledSurface", "kind": "base", "registered": false, "group": "grpUtilitiesFunctionObjects", "header": "src/sampling/sampledSurface/sampledSurface/sampledSurface.H", "libs": [], "summary": "An abstract class for surfaces with sampling.", "description": "An abstract class for surfaces with sampling.\n\nThe constructors for the derived classes should generally start in a\n'expired' condition (ie, needsUpdate() == true) and rely on a\nsubsequent call to the update() method to complete the initialization.\nDelaying the final construction as late as possible allows the\nconstruction of surfaces that may depend on intermediate calculation\nresults (eg, iso-surfaces) and also avoids the unnecessary\nreconstruction of surfaces between sampling intervals.\n\nIt is the responsibility of the caller to ensure that the surface\nupdate() is called before the surface is used.  The update() method\nimplementation should do nothing when the surface is already\nup-to-date.\n\nAny sampler is assumed to work for the standard volume field types.\nSome may also support surface fields.\n\nDictionary entries:", "example": "", "otherExamples": [], "tables": [{"heading": "", "rows": [{"name": "name", "desc": "Alternative name", "type": "", "reqd": "no", "default": ""}, {"name": "enabled", "desc": "Enable/disable the surface?", "type": "", "reqd": "no", "default": "yes"}, {"name": "interpolate", "desc": "Interpolate to nodes instead of faces", "type": "", "reqd": "no", "default": "false"}, {"name": "invariant", "desc": "Invariant with geometry change (use with caution!)", "type": "", "reqd": "no", "default": "false"}]}], "inherited": [], "note": "The invariant switch is an advanced feature to declare that the surface\nis unaffected by changes in the general mesh geometry. For example, if\nsampling on a static patch while some other motion occurs elsewhere. If\nused improperly, there is a significant possibility for problems\n(caveat emptor).", "seeAlso": "", "includeFunc": [], "tutorials": [], "aliases": ""}, "scalarTransport": {"name": "scalarTransport", "kind": "functionObject", "registered": true, "group": "grpSolversFunctionObjects", "header": "src/functionObjects/solvers/scalarTransport/scalarTransport.H", "libs": ["solverFunctionObjects"], "summary": "Computes the transport equation for a passive scalar in single-phase or two-phase flow, considering both incompressible and compressible cases:", "description": "Computes the transport equation for a passive scalar in single-phase or\ntwo-phase flow, considering both incompressible and compressible cases:\n\n[formula]\n\nwhere:\n\\vartable\n  T       | Passive scalar field\n  \\rho    | (Generic) Fluid density which is unity when not specified\n  \\phi_\\alpha | (Generic) Flux field\n  \\alpha  | Phase fraction which is unity for single-phase flows\n  D_T     | Diffusivity representing the diffusive transpor idual is larger then the domain mean residuals.\n\nFor option 4, the following relation is used, where \\phi_4 is\nthe face weight (Note that \\phi_4 = 0.5 for orthogonal meshes):\n\n[formula]\n\nFor option 5, the following relation is used, where \\phi_5 is\nthe cell skewness:\n\n[formula]\n\nFor option 6, the following relation is used:\n\n[formula]\n\nwhere\n\\vartable\n    Co1 | Courant number below which scheme2 is used\n    Co2 | Courant number above which scheme1 is used\n\\endvartable\n\nThe final factor is determined by:\n\n[formula]\n\nAn indicator (volume) field, named blendedIndicator\nis generated if the log flag is on:\n- 1 represent scheme1 as active,\n- 0 represent scheme2 as active.\n\nAdditional reporting is written to the standard output, providing\nstatistics as to the number of cells used by each scheme.\n\nOperands:", "example": "stabilityBlendingFactorFO\n{\n    // Mandatory entries\n    type                stabilityBlendingFactor;\n    libs                (fieldFunctionObjects);\n    field               <word>;    // U;\n    result              <word>;    // UBlendingFactor;\n\n    // Optional entries\n    tolerance           <scalar>;\n\n    // Conditional entries\n    // Any of the options can be chosen in combinations\n\n        // Option-1\n        switchNonOrtho      true;\n        nonOrthogonality    nonOrthoAngle;\n        maxNonOrthogonality 20;\n        minNonOrthogonality 60;\n\n        // Option-2\n        switchGradCc        true;\n        maxGradCc           3;\n        minGradCc           4;\n\n        // Option-3\n        switchResiduals     true;\n        maxResidual         10;\n        residual            initialResidual:p;\n        P                   1.5;\n        I                   0;\n        D                   0.5;\n\n        // Option-4\n        switchFaceWeight    true;\n        maxFaceWeight       0.3;\n        minFaceWeight       0.2;\n\n        // Option-5\n        switchSkewness      true;\n        maxSkewness ects/timeControl/timeControlFunctionObject.H", "summary": "Wrapper around functionObjects to add time control.", "tables": []}}};
const fos = Object.values(DB.functionObjects).filter(e => e.kind !== "base");
const short = g => (g || "").replace(/^grp|FunctionObjects$/g, "") || "Other";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let group = "All", current = null;

document.getElementById("meta").textContent =
  `${DB.version} · ${fos.filter(e => e.kind === "functionObject").length} function objects · built ${DB.built}`;

// Theme toggle (per-viewer convenience only)
const root = document.documentElement;
try { const t = localStorage.getItem("foTheme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("foTheme", root.dataset.theme); } catch (e) {}
};

// Group chips
const groups = ["All", ...[...new Set(fos.map(e => short(e.group)))].sort()];
const chips = document.getElementById("chips");
groups.forEach(g => {
  const b = document.createElement("button");
  b.className = "chip" + (g === group ? " on" : ""); b.textContent = g;
  b.onclick = () => { group = g; [...chips.children].forEach(c => c.classList.toggle("on", c === b)); render(); };
  chips.appendChild(b);
});

function haystack(e) {
  return (e.name + " " + e.description + " " + e.header + " " + e.includeFunc.join(" ") + " " + (e.aliases || "") + " " +
    e.tables.flatMap(t => t.rows.map(r => r.name + " " + r.desc)).join(" ")).toLowerCase();
}
fos.forEach(e => e._hay = haystack(e));

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const onlyF = document.getElementById("optF").checked;
  const cloud = document.getElementById("optC").checked;
  let es = fos.filter(e => (cloud || e.kind === "functionObject")
    && (group === "All" || short(e.group) === group)
    && (!onlyF || e.includeFunc.length)
    && q.every(w => e._hay.includes(w)));
  es.sort((a, b) => {
    const sa = q.filter(w => a.name.toLowerCase().includes(w)).length;
    const sb = q.filter(w => b.name.toLowerCase().includes(w)).length;
    return sb - sa || a.name.toLowerCase().localeCompare(b.name.toLowerCase());
  });
  const ul = document.getElementById("list");
  ul.innerHTML = es.map(e => `<li data-n="${esc(e.name)}" class="${current === e.name ? "sel" : ""}">
    <div class="n">${esc(e.name)}${e.includeFunc.length ? '<span class="badge">includeFunc</span>' : ""}${e.kind === "cloudFunction" ? '<span class="badge">cloud</span>' : ""}</div>
    <div class="s">${esc(short(e.group))} · ${esc(e.summary)}</div></li>`).join("");
  document.getElementById("count").textContent = `${es.length} shown`;
}

function codeBox(text) {
  return `<div class="codebox"><button onclick="copyCode(this)">Copy</button><pre>${esc(text)}</pre></div>`;
}
function copyCode(btn) {
  const t = btn.nextElementSibling.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1200); },
    () => { const r = document.createRange(); r.selectNodeContents(btn.nextElementSibling);
            const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
}
function tableHtml(tables) {
  return tables.map(t => `${t.heading ? `<div class="theading">${esc(t.heading)}</div>` : ""}
    <div class="tablewrap"><table><tr><th>Property</th><th>Type</th><th>Required</th><th>Default</th><th>Description</th></tr>
    ${t.rows.map(r => `<tr class="${r.reqd === "yes" ? "req" : ""}"><td class="k">${esc(r.name)}</td><td>${esc(r.type)}</td>
      <td>${esc(r.reqd)}</td><td>${esc(r.default || "-")}</td><td>${esc(r.desc)}</td></tr>`).join("")}</table></div>`).join("");
}

function show(name) {
  const e = DB.functionObjects[name]; if (!e) return;
  current = name;
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("sel", li.dataset.n === name));
  let h = `<h2>${esc(e.name)}</h2>
    <div class="sub">${esc(short(e.group))} · ${esc(e.kind)} · <code>${esc(e.header)}</code>
    ${e.libs.length ? ` · libs (${esc(e.libs.join(" "))})` : ""}</div>
    <h3>Description</h3><div class="desc">${esc(e.description || "-")}</div>`;
  if (e.example) h += `<h3>Example (from header)</h3>${codeBox(e.example)}`;
  if (e.otherExamples.length) h += `<details><summary>More examples (${e.otherExamples.length})</summary>${e.otherExamples.map(codeBox).join("<br>")}</details>`;
  if (e.tables.length) h += `<h3>Parameters</h3>${tableHtml(e.tables)}`;
  if (e.inherited.length) {
    h += `<h3>Inherited entries</h3>`;
    e.inherited.forEach(b => {
      const base = DB.bases[b];
      h += base && base.tables.length
        ? `<details><summary>${esc(b)}</summary>${tableHtml(base.tables)}</details>`
        : `<div><code>${esc(b)}</code></div>`;
    });
  }
  if (e.note) h += `<h3>Note</h3><div class="desc">${esc(e.note)}</div>`;
  if (e.includeFunc.length) h += `<h3>#includeFunc templates</h3>${codeBox(e.includeFunc.map(t =>
      `#includeFunc ${t.split("/").pop()}    // etc/caseDicts/postProcessing/${t}`).join("\n"))}`;
  h += `<h3>CLI</h3>${codeBox(`foamFO show ${e.name}\nfoamFO example ${e.name}\nfoamFO add ${e.name} -case . --insert`)}`;
  if (e.tutorials.length) h += `<h3>Used in tutorials (${e.tutorials.length})</h3><ul class="paths">${e.tutorials.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  if (e.seeAlso) h += `<h3>See also</h3><div class="desc">${esc(e.seeAlso)}</div>`;
  const main = document.getElementById("detail");
  main.innerHTML = h; main.scrollTop = 0;
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}

document.getElementById("list").onclick = ev => { const li = ev.target.closest("li"); if (li) show(li.dataset.n); };
["q", "optF", "optC"].forEach(id => document.getElementById(id).addEventListener("input", render));
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement.id !== "q") { ev.preventDefault(); document.getElementById("q").focus(); }
});
render();
const h0 = decodeURIComponent(location.hash.slice(1));
if (h0 && DB.functionObjects[h0]) show(h0);
</script>
